global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    static_configs: [{ targets: ["backend:8000"] }]
    metrics_path: /metrics
  - job_name: worker
    static_configs: [{ targets: ["worker:9100"] }]
    metrics_path: /metrics
  - job_name: bifrost
    static_configs: [{ targets: ["bifrost:8080"] }]
    metrics_path: /metrics
