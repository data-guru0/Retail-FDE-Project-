repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(backend|worker|mcp-server|ml|scripts)/
      - id: ruff-format
        files: ^(backend|worker|mcp-server|ml|scripts)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^(backend|worker)/app|^worker/pipeline/
        additional_dependencies: [pydantic]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prompt-version-check
        name: prompt files carry a version bump
        entry: python scripts/hooks/check_prompt_versions.py
        language: system
        files: ^worker/pipeline/prompts/
        pass_filenames: false
      - id: alembic-head
        name: single alembic head
        entry: python scripts/hooks/check_alembic_head.py
        language: system
        files: ^backend/alembic/
        pass_filenames: false
      - id: frontend-lint
        name: eslint + prettier (frontend)
        entry: bash -c 'cd frontend && npx eslint . && npx prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false
