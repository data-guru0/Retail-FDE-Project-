# Local dev tweaks: bind-mount source for live reload + so generated files
# (alembic migrations, etc.) land on the host. Compose loads this automatically.
services:
  backend:
    volumes:
      - ./backend:/app
      - ./seed:/app/seed:ro
      - ./docs:/app/docs:ro
      - vault_creds:/vault-creds:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    volumes:
      - ./worker:/app
      - ./ml:/app/ml
      - ./scenarios:/app/scenarios:ro
      - ./docs:/app/docs
      - vault_creds:/vault-creds:ro
    ports: ["9100:9100"]

  mcp-server:
    volumes:
      - ./mcp-server:/app
